name: CI

on:
  pull_request:
    branches: [main, staging, production]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://dungeon:dungeon@localhost:5432/dungeon_test

jobs:
  quality:
    name: Lint, format, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm test

  integration:
    name: Integration tests (API + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeon
          POSTGRES_PASSWORD: dungeon
          POSTGRES_DB: dungeon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dungeon -d dungeon_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm --filter api db:migrate
      - run: pnpm test:integration

  e2e:
    name: E2E (Playwright, API + web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dungeon
          POSTGRES_PASSWORD: dungeon
          POSTGRES_DB: dungeon_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dungeon -d dungeon_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter api db:generate
      - run: pnpm --filter api db:migrate
      - name: Install Playwright browsers
        run: pnpm --filter e2e exec playwright install --with-deps chromium
      - name: Run E2E suite (Playwright starts api and web)
        run: pnpm test:e2e
        env:
          CI: true
          APP_ENV: test
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          retention-days: 14

  docs:
    name: Docs links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links (offline, relative links only)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
          fail: true
