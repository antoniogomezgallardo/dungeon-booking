name: Setup Node and pnpm
description: Installs Node 22, pnpm (from packageManager) and the workspace dependencies with caching.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
