# Production environment (GitLab Flow `production` branch). Everything runs in containers.
# Ports: web 8200, api 3200. Database is not exposed to the host.
name: dungeon-production
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: dungeon
      POSTGRES_DB: dungeon_production
    volumes:
      - db-production-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dungeon -d dungeon_production']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      APP_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://dungeon:dungeon@db:5432/dungeon_production
    ports:
      - '3200:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy only on 2xx: /health answers 503 when the database is unreachable.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s # migrations run before the server listens

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8200:80'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-production-data:
